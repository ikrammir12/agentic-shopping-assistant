services:

  # -------------------------
  # Backend: FastAPI
  # -------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentic-shopping-api

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - agentic_shopping_db:/app/Database
      - agentic_shopping_logs:/app/app/logs

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # -------------------------
  # Frontend: React + Nginx
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: agentic-shopping-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


# -------------------------
# Persistent volumes
# -------------------------
volumes:
  agentic_shopping_db:
    name: agentic_shopping_db

  agentic_shopping_logs:
    name: agentic_shopping_logs